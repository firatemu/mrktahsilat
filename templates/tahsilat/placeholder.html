{% extends 'base.html' %}

{% block title %}Geliştirilmekte{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4 class="mb-0">Özellik Geliştirilmekte</h4>
                </div>
                <div class="card-body text-center">
                    <div class="alert alert-info">
                        <i class="fas fa-tools fa-3x mb-3"></i>
                        <h5>Bu özellik henüz geliştirilmektedir.</h5>
                        <p class="mb-0">Lütfen daha sonra tekrar kontrol edin.</p>
                    </div>
                    <a href="{% url 'tahsilat:dashboard' %}" class="btn btn-primary">
                        <i class="fas fa-arrow-left"></i> Ana Sayfaya Dön
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
