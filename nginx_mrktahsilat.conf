server {
    listen 80;
    server_name mrktahsilat.com www.mrktahsilat.com;
    return 301 https://$host$request_uri;  # HTTP'yi HTTPS'ye yönlendir
}

server {
    listen 443 ssl http2;
    server_name mrktahsilat.com www.mrktahsilat.com;

    # SSL Certificates (Cloudflare SSL ile zaten var)
    ssl_certificate /etc/letsencrypt/live/mrktahsilat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrktahsilat.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # GÜVENLIK HEADERS
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net fonts.googleapis.com; font-src 'self' fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;
    
    # Server bilgilerini gizle
    server_tokens off;

    location / {
        proxy_pass http://unix:/var/www/mrktahsilat/mrktahsilat.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Django SECURE_PROXY_SSL_HEADER ile uyumlu
        
        # Cache control for dynamic content
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Timeout ayarları
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /static/ {
        alias /var/www/mrktahsilat/staticfiles/;
        expires 1h;
        add_header Cache-Control "public, immutable";
        
        # Static dosyalar için güvenlik
        location ~* \.(py|pyc|pyo|pyd|so|conf|ini|log|bak|backup|sql)$ {
            deny all;
        }
    }

    location /media/ {
        alias /var/www/mrktahsilat/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Sadece belirli dosya türlerine izin ver
        location ~* \.(jpg|jpeg|png|gif|pdf|doc|docx|xls|xlsx)$ {
            # İzin verilen dosyalar
        }
        
        # Diğer dosyaları engelle
        location ~* \.(py|pyc|pyo|pyd|so|conf|ini|log|bak|backup|sql|php|sh)$ {
            deny all;
        }
    }
    
    # Hassas dosyalara erişimi engelle
    location ~* \.(env|git|htaccess|htpasswd|ini|conf|bak|backup|sql|log)$ {
        deny all;
    }
    
    # Dizin listesini engelle
    location ~ /\. {
        deny all;
    }
    
    # Admin panelini sınırla (isteğe bağlı)
    location /admin/ {
        proxy_pass http://unix:/var/www/mrktahsilat/mrktahsilat.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}